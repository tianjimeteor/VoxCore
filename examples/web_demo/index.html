<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>VoxCore Web Demo</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        max-width: 720px;
        margin: 40px auto;
        padding: 0 16px;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.5rem;
      }
      .row {
        display: flex;
        gap: 8px;
        margin: 12px 0;
      }
      input,
      button,
      textarea {
        font: inherit;
        padding: 8px 12px;
        border-radius: 8px;
        border: 1px solid #8884;
      }
      input,
      textarea {
        flex: 1;
      }
      button {
        background: #4f46e5;
        color: white;
        border: none;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
      }
      #log {
        margin-top: 16px;
        border: 1px solid #8884;
        border-radius: 8px;
        padding: 12px;
        min-height: 220px;
        white-space: pre-wrap;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.95rem;
      }
      .muted {
        opacity: 0.65;
      }
    </style>
  </head>
  <body>
    <h1>VoxCore Web Demo</h1>
    <p class="muted">
      Minimal client to smoke-test the <code>/ws</code> gateway. Register, log in,
      then type a message. Audio streaming is deliberately omitted here — see
      <code>sdks/js</code> for the full WebRTC client.
    </p>

    <div class="row">
      <input id="api" value="http://localhost:8000" />
      <input id="user" placeholder="username" />
      <input id="pass" type="password" placeholder="password (10+ chars)" />
      <button id="register">Register</button>
      <button id="login">Login</button>
    </div>

    <div class="row">
      <textarea id="msg" rows="2" placeholder="Type a message and press Send…"></textarea>
      <button id="send" disabled>Send</button>
    </div>

    <div id="log"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const log = (line) => ($("log").textContent += line + "\n");
      let ws = null;
      let token = null;

      async function post(path, body) {
        const r = await fetch($("api").value + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.detail || r.statusText);
        return data;
      }

      $("register").onclick = async () => {
        try {
          const r = await post("/auth/register", {
            username: $("user").value,
            password: $("pass").value,
          });
          token = r.access_token;
          log("✓ registered");
          connect();
        } catch (e) {
          log("✗ register: " + e.message);
        }
      };

      $("login").onclick = async () => {
        try {
          const r = await post("/auth/login", {
            username: $("user").value,
            password: $("pass").value,
          });
          token = r.access_token;
          log("✓ logged in");
          connect();
        } catch (e) {
          log("✗ login: " + e.message);
        }
      };

      function connect() {
        const url = $("api").value.replace(/^http/, "ws") + "/ws?token=" + token;
        ws = new WebSocket(url);
        ws.onopen = () => {
          log("[ws open]");
          $("send").disabled = false;
        };
        ws.onmessage = (ev) => {
          const m = JSON.parse(ev.data);
          if (m.type === "chunk") {
            $("log").textContent += m.text;
          } else if (m.type === "transcript") {
            log("\n> " + m.text);
          } else if (m.type === "error") {
            log("[error] " + m.detail);
          } else {
            log("[" + m.type + "] " + JSON.stringify(m));
          }
        };
        ws.onclose = () => {
          log("[ws closed]");
          $("send").disabled = true;
        };
      }

      $("send").onclick = () => {
        if (!ws || ws.readyState !== 1) return;
        ws.send(JSON.stringify({ type: "text", text: $("msg").value }));
        $("msg").value = "";
      };
    </script>
  </body>
</html>
