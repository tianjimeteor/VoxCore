# One-command VoxCore stack for local evaluation.
#
# Usage:
#   cp .env.example .env
#   # edit .env, at minimum set JWT_SECRET_KEY (use: docker run --rm voxcore gen-secret)
#   docker compose up

services:
  voxcore:
    build: .
    image: voxcore:local
    container_name: voxcore
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:///data/voxcore.db
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - voxcore_data:/app/data
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).status==200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  voxcore_data:
