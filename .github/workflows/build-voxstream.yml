name: Build VoxStream

on:
  push:
    tags: ["voxstream-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artefact: voxstream-windows-x64.zip
          - os: macos-latest
            artefact: voxstream-macos-arm64.tar.gz
          - os: ubuntu-latest
            artefact: voxstream-linux-x86_64.tar.gz
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File apps/voxstream/packaging/build.ps1

      - name: Build (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash apps/voxstream/packaging/build.sh

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: voxstream-${{ matrix.os }}
          path: dist/voxstream-*.*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/voxstream-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute checksums
        run: |
          cd dist
          sha256sum voxstream-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/voxstream-*
            dist/SHA256SUMS.txt
          generate_release_notes: true
          name: VoxStream ${{ github.ref_name }}
          body: |
            VoxStream desktop bundle — point OBS to `http://localhost:7860/overlay`.

            See [apps/voxstream/README.md](https://github.com/tianjimeteor/VoxCore/blob/main/apps/voxstream/README.md).
